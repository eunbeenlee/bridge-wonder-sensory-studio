<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<title>Bridge Wonder | 선생님 운영공간 · UI 소스</title>
<link rel="stylesheet" href="../assets/css/administration.css"></head>
<body>
<!-- BW25_UI_START -->
<main id="loginScreen" class="login-shell">
    <div class="login-wrap">
      <div class="login-brand"><img class="logo" alt="Bridge Wonder" src="https://bridgewonder.bridgeacademy.co.kr/assets/img/bridge-wonder-logo.png"><div class="eyebrow">원장·선생님 전용</div><div class="login-title">선생님 운영공간</div></div>
      <section class="login-card" aria-label="직원 로그인">
        <div id="loginStepPassword">
          <div class="bw23-badge">BRIDGE WONDER · STAFF</div>
          <h2>운영 관리 로그인</h2>
          <p class="help">등록된 업무용 이메일과 비밀번호로 로그인하세요.</p>
          <form id="passwordLoginForm" autocomplete="on">
            <div><label for="passwordEmail">업무용 이메일</label><input id="passwordEmail" type="email" autocomplete="username" maxlength="180" placeholder="name@example.com" required></div>
            <div><label for="passwordInput">비밀번호</label><input id="passwordInput" type="password" autocomplete="current-password" maxlength="100" required></div>
            <button type="submit" class="btn btn-primary w-full">로그인</button>
          </form>
          <div class="bw23-login-actions">
            <button type="button" id="bw23FirstTime" class="inline-link">처음 사용하는 계정</button>
            <button type="button" id="bw23Reset" class="inline-link">비밀번호 재설정</button>
          </div>
          <div class="bw23-legal">최초 1회 이메일 인증 후 비밀번호를 설정합니다. 계정별 접근 권한은 원장이 관리합니다.</div>
        </div>
        <div id="loginStepEmail" hidden>
          <h2>안녕하세요.</h2>
          <p class="help">계정 확인을 위해 이메일로 6자리 인증번호를 보내드립니다.</p>
          <form id="emailForm"><div><label for="loginEmail">업무용 이메일</label><input id="loginEmail" name="email" type="email" placeholder="name@example.com" autocomplete="email" maxlength="180" required></div><button type="submit" class="btn btn-primary w-full">인증번호 받기</button></form>
        </div>
        <div id="loginStepOtp" hidden>
          <h2>이메일 인증 및 비밀번호 설정</h2><p class="help" id="sentTo"></p>
          <form id="otpForm"><div><label for="loginOtp">6자리 인증번호</label><input class="otp" id="loginOtp" name="otp" type="text" inputmode="numeric" autocomplete="one-time-code" placeholder="000000" pattern="[0-9]{6}" maxlength="6" required></div>
          <div><label for="bw23NewPass">새 비밀번호 (12자 이상)</label><input id="bw23NewPass" type="password" autocomplete="new-password" minlength="12" maxlength="100" required></div>
          <div><label for="bw23ConfirmPass">새 비밀번호 확인</label><input id="bw23ConfirmPass" type="password" autocomplete="new-password" minlength="12" maxlength="100" required></div>
          <button type="submit" class="btn btn-primary w-full">비밀번호 설정 완료</button></form>
          <button id="backToEmail" type="button" class="inline-link">이메일 다시 입력하기</button>
        </div>
        <div id="loginFeedback" class="inline-status" role="status" aria-live="polite" style="margin-top:15px"></div>
        <div class="login-note">승인된 직원만 사용할 수 있습니다. 모든 정보는 업무 목적에 한해 조회하세요.</div>
      </section>
    </div>
  </main>
