<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#fbf8f2">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-src https://script.google.com https://*.googleusercontent.com https://accounts.google.com; form-action 'none'; object-src 'none'; base-uri 'none'; upgrade-insecure-requests">
  <title>Bridge Wonder | 직원 운영센터</title>
  <link rel="icon" href="../assets/img/favicon.png">
  <style>
    :root{color-scheme:light;--cream:#fbf8f2;--forest:#40543a;--line:#e6e4da;--muted:#6b7867}
    *,*::before,*::after{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--cream);color:var(--forest);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}
    #portal{display:block;border:0;width:100vw;width:100dvw;height:100vh;height:100dvh;background:var(--cream)}
    #status{position:fixed;inset:0;z-index:3;display:grid;place-items:center;background:var(--cream);pointer-events:none;transition:opacity .25s}
    #status[hidden]{display:none}
    .welcome{padding:28px;text-align:center}.welcome img{width:178px;max-width:60%;height:auto}.welcome p{margin:17px auto 0;color:var(--muted);font-size:13px}
    #assist{position:fixed;right:12px;bottom:10px;z-index:2;border:1px solid var(--line);border-radius:18px;padding:6px 12px;background:#fffefa;color:var(--muted);text-decoration:none;font-size:11px;opacity:.75}
    #assist:focus,#assist:hover{opacity:1}
  </style>
</head>
<body>
  <div id="status" role="status" aria-live="polite"><div class="welcome"><img src="../assets/img/bridge-wonder-logo.png" alt="Bridge Wonder"><p>직원 운영센터를 여는 중입니다…</p></div></div>
  <iframe id="portal" title="Bridge Wonder 직원 운영센터" allow="clipboard-write" referrerpolicy="no-referrer" loading="eager"></iframe>
  <a id="assist" href="#" rel="noopener noreferrer" target="_blank">화면이 열리지 않을 때 직접 접속</a>
  <script src="./portal.js" defer></script>
</body>
</html>
