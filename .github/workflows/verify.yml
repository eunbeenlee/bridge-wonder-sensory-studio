name: Verify Bridge Wonder

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main, 'review/**']

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - name: payroll tests
        if: always()
        run: node tests/payroll.test.cjs
      - name: acceleration tests
        if: always()
        run: node tests/acceleration.test.cjs
      - name: security tests
        if: always()
        run: node tests/security.test.cjs
      - name: payroll-ui tests
        if: always()
        run: node tests/payroll-ui.test.cjs
      - name: administration tests
        if: always()
        run: node tests/administration.test.cjs
      - name: staff-login-gateway tests
        if: always()
        run: node tests/staff-login-gateway.test.cjs
      - name: staff-google-bridge tests
        if: always()
        run: node tests/staff-google-bridge.test.cjs
      - name: staff-static-fast tests
        if: always()
        run: node tests/staff-static-fast.test.cjs
      - name: staff-v28-home tests
        if: always()
        run: node tests/staff-v28-home.test.cjs
      - name: native-KDF tests
        if: always()
        run: node tests/native-kdf-login.test.cjs
      - name: account issuance tests
        if: always()
        run: node tests/account-issuance.test.cjs
      - name: staff UX V31 tests
        if: always()
        run: node tests/staff-ux-v31.test.cjs
      - name: enterprise top-navigation V33 tests
        if: always()
        run: node tests/staff-enterprise-v33.test.cjs
