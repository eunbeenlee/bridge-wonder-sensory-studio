name: Verify Bridge Wonder

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main, 'review/**', 'release/**']

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - name: Payroll server tests
        if: always()
        run: node tests/payroll.test.cjs
      - name: Acceleration tests
        if: always()
        run: node tests/acceleration.test.cjs
      - name: Security tests
        if: always()
        run: node tests/security.test.cjs
      - name: Payroll UI tests
        if: always()
        run: node tests/payroll-ui.test.cjs
      - name: Staff administration tests
        if: always()
        run: node tests/administration.test.cjs
      - name: Login gateway tests
        if: always()
        run: node tests/staff-login-gateway.test.cjs
      - name: Google bridge tests
        if: always()
        run: node tests/staff-google-bridge.test.cjs
      - name: Static-first UI tests
        if: always()
        run: node tests/staff-static-first.test.cjs
