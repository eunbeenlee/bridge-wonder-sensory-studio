name: Verify Bridge Wonder

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main, 'review/**']

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - name: payroll tests
        if: always()
        run: node tests/payroll.test.cjs
      - name: acceleration tests
        if: always()
        run: node tests/acceleration.test.cjs
      - name: security tests
        if: always()
        run: node tests/security.test.cjs
      - name: payroll-ui tests
        if: always()
        run: node tests/payroll-ui.test.cjs
      - name: administration tests
        if: always()
        run: node tests/administration.test.cjs
      - name: staff-login-gateway tests
        if: always()
        run: node tests/staff-login-gateway.test.cjs
      - name: staff-google-bridge tests
        if: always()
        run: node tests/staff-google-bridge.test.cjs
      - name: staff-static-fast tests
        if: always()
        run: node tests/staff-static-fast.test.cjs
      - name: staff-v28-home tests
        if: always()
        run: node tests/staff-v28-home.test.cjs
      - name: native-KDF tests
        if: always()
        run: node tests/native-kdf-login.test.cjs
      - name: account issuance tests
        if: always()
        run: node tests/account-issuance.test.cjs
      - name: staff UX V31 tests
        if: always()
        run: node tests/staff-ux-v31.test.cjs
      - name: enterprise top-navigation V33 tests
        if: always()
        run: node tests/staff-enterprise-v33.test.cjs
      - name: staff layout and copy polish V34 tests
        if: always()
        run: node tests/staff-polish-v34.test.cjs
      - name: sensory theme and account-only Instagram profile V35 tests
        if: always()
        run: node tests/sensory-profile-v35.test.cjs
      - name: student intake and monthly experiences V37 tests
        if: always()
        run: node tests/academic-management-v37.test.cjs
      - name: unified V32 compliance and inspection readiness PDF tests
        if: always()
        run: node tests/compliance-v32.test.cjs
      - name: sensory-studio staff workflow V39 tests
        if: always()
        run: node tests/staff-sensory-v39.test.cjs
      - name: executive staff layout V40 tests
        if: always()
        run: node tests/staff-enterprise-v40.test.cjs
      - name: top categories, four-color branding and Korean copy V41 tests
        if: always()
        run: node tests/staff-topnav-v41.test.cjs
      - name: sensory studio document catalog V42 tests
        if: always()
        run: node tests/staff-documents-v42.test.cjs
      - name: education-support compliance and Korean copy V43 tests
        if: always()
        run: node tests/staff-legal-v43.test.cjs
      - name: V44 four-child parent-participation staff tests
        if: always()
        run: node tests/staff-parent-participation-v44.test.cjs
      - name: V45 staff lesson-plan library tests
        if: always()
        run: node tests/lesson-plans-v45.test.cjs
      - name: V46 public studio four-child parent participation tests
        if: always()
        run: node tests/sensory-parent-participation-v44.test.cjs
      - name: V47 staff parent FAQ drafts and policy safeguards tests
        if: always()
        run: node tests/staff-parent-faq-v47.test.cjs
      - name: V48 studio operating settings Q&A and safe field import tests
        if: always()
        run: node tests/staff-course-policy-v48.test.cjs
      - name: V49 taxable finance scenario and private ledger tests
        if: always()
        run: node tests/staff-finance-v49.test.cjs
      - name: Create V45 staff lesson-plan installer ZIP
        if: success()
        run: python3 tools/build-lesson-plan-install-v45.py
      - name: Upload V45 staff lesson-plan installer
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BridgeWonder-V45-Lesson-Plans-Staff-Update
          path: dist/Bridge_Wonder_V45_Lesson_Plans_Staff_Update.zip
          if-no-files-found: error
          retention-days: 30
      - name: Create staff Apps Script V38 installer ZIP
        if: success()
        run: python3 tools/build-gas-install-package.py
      - name: Upload staff Apps Script installer
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BridgeWonder-V38-Staff-AppsScript-Install
          path: dist/Bridge_Wonder_V38_Staff_AppsScript_Install.zip
          if-no-files-found: error
          retention-days: 30

      - name: Build V46 combined staff family + lesson upload patch
        if: success()
        run: python3 tools/build-family-install-v46.py
      - name: Upload V46 combined staff installer
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BridgeWonder-V46-Family-And-Lesson-Staff-Patch
          path: dist/Bridge_Wonder_V46_Staff_Family_And_Lesson_Upload.zip
          if-no-files-found: error
          retention-days: 30

      - name: V50 staff category URLs and permission-safe deep links
        if: always()
        run: node tests/staff-deep-links-v50.test.cjs
      - name: V52 staff UI safety tests
        if: always()
        run: node tests/staff-design-v52.test.cjs
      - name: V53 staff modern UI tests
        if: always()
        run: node tests/staff-modern-v53.test.cjs
      - name: V54 ten-week tuition, editable occupancy and insurance overflow
        if: always()
        run: node tests/staff-pricing-capacity-v54.test.cjs
      - name: V55 integrated setup and approved public pricing
        if: always()
        run: node tests/staff-integration-v55.test.cjs
      - name: V56 mixed enrollment and calendar-based financial planning
        if: always()
        run: node tests/staff-planning-v56.test.cjs
      - name: V57 shared workspace, protected editing and retry-safe saves
        if: always()
        run: node tests/staff-workspace-v57.test.cjs
      - name: V58 daily workbench, privacy and permission-filtered rollups
        if: always()
        run: node tests/staff-workbench-v58.test.cjs
      - name: V59 annual curriculum procurement, launch plan and private budget validation
        if: always()
        run: node tests/staff-launch-v59.test.cjs
      - name: Build V59 integrated staff installer
        if: success()
        run: python3 tools/build-integrated-install-v59.py
      - name: Upload V59 integrated staff installer
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BridgeWonder-V59-Integrated-Staff-Install
          path: dist/Bridge_Wonder_V59_Integrated_Staff_Install.zip
          if-no-files-found: error
          retention-days: 30
      - name: Build V58 integrated staff installer
        if: success()
        run: python3 tools/build-integrated-install-v58.py
      - name: Upload V58 integrated staff installer
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BridgeWonder-V58-Integrated-Staff-Install
          path: dist/Bridge_Wonder_V58_Integrated_Staff_Install.zip
          if-no-files-found: error
          retention-days: 30
      - name: Build V57 integrated staff installer
        if: success()
