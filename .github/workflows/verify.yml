      - name: Upload V57 integrated staff installer
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BridgeWonder-V57-Integrated-Staff-Install
          path: dist/Bridge_Wonder_V57_Integrated_Staff_Install.zip
          if-no-files-found: error
          retention-days: 30
      - name: Build V56 integrated staff Apps Script installer
        if: success()
        run: python3 tools/build-integrated-install-v56.py
      - name: Upload V56 integrated staff installer
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BridgeWonder-V56-Integrated-Staff-Install
          path: dist/Bridge_Wonder_V56_Integrated_Staff_Install.zip
          if-no-files-found: error
          retention-days: 30
      - name: Build V55 integrated staff Apps Script installer
        if: success()
        run: python3 tools/build-integrated-install-v55.py
      - name: Upload V55 integrated staff installer
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BridgeWonder-V55-Integrated-Staff-Install
          path: dist/Bridge_Wonder_V55_Integrated_Staff_Install.zip
          if-no-files-found: error
          retention-days: 30
      - name: Build V49 owner finance Apps Script patch
        if: success()
        run: python3 tools/build-finance-install-v49.py
      - name: Upload V49 finance Apps Script patch
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BridgeWonder-V49-Finance-Staff-Update
          path: dist/Bridge_Wonder_V49_Staff_Finance_Install.zip
          if-no-files-found: error
          retention-days: 30
